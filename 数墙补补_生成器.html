  let CAL_EXTRA = 0;                           // 噪声底标定时故意让出的高度
  const slackMM = () => (S.per === 2 ? GEO.slack2 : GEO.slack) + CAL_EXTRA;
  /* 每页题量上限（用户 2026-11-17 第 3 条：「每一页题目最多不要超过30个」）。
     一页两卷是一张纸印两卷，所以上限摊到每一卷头上是 15 面——限的是"一页纸"，不是"一卷"。 */
  const WALL_CAP = 30;
  const wallsCap = () => Math.max(1, Math.floor(WALL_CAP / (S.per === 2 ? 2 : 1)));

  /* 说明块三态：完整（玩法 + 对错示例）／紧凑（去掉示例）／不要。
     一页两卷只有半页，勾"完整"也自动按紧凑排——这是尺寸决定的，不是偷偷改内容。 */
  const miniRule = () => S.rule === 'mini' || (S.per === 2 && S.rule === 'full');
  function ruleH() { return S.rule === 'off' ? 0 : (miniRule() ? GEO.rule2 : GEO.rule); }

  /* 横向并列数：每行几面墙由形状定（用户 2026-11-17 第 3 条点名的 5 / 4 / 3 / 3 / 3），
     砖宽反过来由"cols 面 + 行内缝"在 184mm 版心里解出来。形状是逐带参数，所以
     baseCols/colsFor 都要带上 shape——两层3块（底 2 块）和两层多块（底 3 块）同为 L=2，
     并列数不同，混为一谈就白缩一档砖宽。
     缝宽这里给一点弹性：一行只有两三面墙的带（三～五层）本来横向就有富余，
     砖越大缝越小，比"墙挨在一起、半页空气"合适。取 max(3mm, GEO.gap − 超过 H_CAP 的那部分)，
     所以砖窄到 h=u×HR≤16mm 时缝仍是 6mm，和旧口径完全一致；只有砖顶到高度上限才让缝。 */
  function widthCap(bands) {
    let u = U_CAP;
    bands.forEach((key) => {
      const b = K.band(key);
      const c = K.colsFor(b.L, b.shape);
      let lo = 3, hi = GEO.gap + 1e-9;
      for (let i = 0; i < 26; i++) {
        const mid = (lo + hi) / 2;
        const uu = (GEO.w - (c - 1) * mid) / (c * K.baseCols(b.L, b.shape));
        if (Math.min(H_CAP, uu * HR) > mid) lo = mid; else hi = mid;   // 砖比缝还厚 → 缝还可以再小
      }
      const gg = (lo + hi) / 2;
      u = Math.min(u, (GEO.w - (c - 1) * gg) / (c * K.baseCols(b.L, b.shape)));
    });
    return Math.max(6, u);
  }
  /* 一行墙占多高：组标签 + L 行砖（卷面下面那栏「数字」已取消，不再记账）。*/
  function bandMetrics(b, u) {
    const h = Math.min(H_CAP, u * HR);
    const one = GEO.label + b.L * h;
    return { h, one };
  }
  /* 答案页每面墙下面多一行推导算式，装页时按这一档的高度算。
     ANS_K＝答案页砖相对学生卷的缩放比例（1＝不缩，学生卷和答案页同一把尺子）。
     只缩砖：组标签（GEO.label）和推导算式那行（GEO.eqline）是字，不是砖——压它们等于
     把老师的板书缩小复印，装页模型和 CSS 里都不让它们跟着 K 走。*/
  let ANS_K = 1;
  const ansOne = (b) => GEO.label + (b.one - GEO.label) * ANS_K + GEO.eqline;

  /* ============ v4.0 第 1 条：一页一卷时把每卷答案压进一页 ============
     用户 2026-11-20：「答案页的内容自动缩小并控制在一页内显示，没必要扩展到 2 页或 3 页。
     一页 2 卷的时，答案页保持现状就行。」——所以：
      · 一页一卷（per=1）：砖最多缩到 ANS_K_MIN，答案压成每卷一页；
      · 一页两卷（per=2）：ANS_K 恒为 1，配对、裁开线、半页那套一律不动。
     ANS_K_MIN＝0.85 是草稿量测（scripts/ans_fit_draft.py）定的：9 个覆盖面里最难的一档
     （五带·每页 30 面、乘法·三层挑战）要 K＝0.90 就进一页，0.85 留了一档余量；
     再低砖里的字就要贴 6.5pt 下限了。
     压到底仍不止一页时不偷加页、也不裁切——ansParts 照自己的装页规则分页，
     状态条点名"压到 85% 还要 N 页"，让老师自己减墙数或改一页两卷。 */
  const ANS_K_MIN = 0.85;
  let ANS_FIT = null;
  /* ansParts 的装页模型（按行贪心）复刻一份，只用来数页数——渲染仍走 ansParts，
     两处必须同口径，所以这里的 cap、rowH 算法跟 ansParts 里逐字对应。 */
  function ansPagesAt(sh, k) {
    const pageH = S.per === 2 ? GEO.h2 : GEO.h;
    const cap = pageH - GEO.hd - (S.per === 2 ? GEO.slack2 : 6);
    const rowH = (b) => GEO.label + (b.one - GEO.label) * k + GEO.eqline + GEO.bandGap;
    const parts = [];
    sh.bands.forEach((b) => {
      const perPage = Math.max(1, Math.floor(cap / rowH(b)));
      for (let done = 0; done < b.rows; done += perPage) parts.push(Math.min(perPage, b.rows - done) * rowH(b));
    });
    let pages = 0, used = 0;
    parts.forEach((h) => {
      if (used && used + h > cap) { pages++; used = 0; }
      used += h;
    });
    return used ? pages + 1 : pages;
  }
  function ansFit(views) {
    ANS_K = 1; ANS_FIT = null;
    if (S.per === 2 || !S.ans || !views.length) return;
    const pagesAt = (k) => Math.max.apply(null, views.map((sh) => ansPagesAt(sh, k)));
    const from = pagesAt(1);
    if (from <= 1) return;
    let k = 1, pages = from;
    for (let c = 0.95; c >= ANS_K_MIN - 1e-9; c = +(c - 0.05).toFixed(2)) {
      k = c; pages = pagesAt(k);
      if (pages <= 1) break;
    }
    ANS_K = k;
    ANS_FIT = { k: k, from: from, pages: pages, floor: pages > 1 };
  }
  /* 压页这件事要说两句实话（状态条 + diag.notes 同一份，口径见 wallsNotes 上面那段注释）：
     · 压到下限仍塞不进一页——不偷加页也不裁字，点名让用户减墙数；
     · 压成功了但答案砖掉到学生可读下限（U_FLOOR）以下——这页是给老师看的，别让孩子在上面写。 */
  function ansNotes(views, u) {
    if (!ANS_FIT || !views.length) return [];
    const pct = Math.round(ANS_FIT.k * 100), au = u * ANS_FIT.k, out = [];
    if (ANS_FIT.floor) {
      out.push(F('noteAnsPages', { pct, from: u.toFixed(1), to: au.toFixed(1), pages: ANS_FIT.pages, total: views[0].total }));
    } else if (au < U_FLOOR) {
      out.push(F('noteAnsFloor', { to: au.toFixed(1), from: u.toFixed(1), floor: U_FLOOR }));
    }
    return out;
  }

  /* 被数域/模式判死的带，版面一行都不该给它占（v3.3 复跑时抓到的）：
     只勾 10以内 + 五带全开，贪心照样给五层留一行、内核出不了题又把它扔掉，
     结果状态条报"27 面"、纸上只有 24 面，底下白留 69mm 还倒打一耙说"布局模型偏保守"。
     可行性是纯函数（kernel 里 bandFeasible 的注释就写着"版面解算之前就要知道"），
     所以解算之前先问一遍：留下的带参与贪心/DP，判死的带原样带出原因给状态条点名。*/
  function winnow() {
    const keep = [], dead = [];
    K.BAND_ORDER.filter((k) => S.bands.includes(k)).forEach((key) => {
      const fe = K.bandFeasible(S.op, S.ranges, key, S.tops);
      if (fe.ok) keep.push(key);
      else dead.push({ key, label: K.band(key).label, reason: fe.reason });
    });
    return { keep, dead };
  }

  /* 最小配置（每种层数各一行）都塞不下时的账，用来给用户说清楚差多少、怎么退 */
  let LAST_FAIL = null;
  /* 一页两卷为凑满一张纸补出来的卷数（份数 1→2、3→4），状态条要点名，不许静默加题。*/
  let PAIR_PAD = 0;
  /* 版面解算（两种走法）
   * 砖宽只由横向预算定；纵向不是"缩砖来填"，是"一行一行加"：
   *   1) 勾了的每一带先各占一行——复选了就都得露面；
   *   2) 剩下的空白按"哪一带最矮就先补哪一带"逐行加，补到再补就超出为止；
   *   3) 带序固定按 BAND_ORDER（易→难），所以一版的第一行永远是两层3块（用户 2026-11-16 第 11 条）。
   * 最小配置都塞不下时返回 null，由外面把砖宽缩一档再来——砖宽是唯一的退路。
   *
   * 「每页墙数」填了数字（用户 2026-11-17 第 6 条）就不撑满了，改走第二条路：
   *   按面数分配行（一行就是 cols 面：两层3块 5 面、两层多块 4 面、三～五层各 3 面），从易到难凑到正好 n 面；
   *   剩余名额装不下任何一带的一行 → 那一带整带不排（面数是显式要求，"每带露面"是自动撑满的默认）；
   *   n 比最小的一行还小 → 取行数最少的那一带排一行，实际面数比 n 多，状态条说清；
   *   这一档砖的高度装不下 n 面 → 返回 null，外面缩一档砖重来（固定墙数时"取装得下的最大砖"）。
   * 两条路都撞每页 30 面这道顶（第 3 条）：撑满贪心到 30 就停手，剩余高度换成大砖；
   *   固定墙数填得比 30 大（或一页两卷时比半页的 15 大）就夹到上限，状态条点名是上限夹的。
   */
  function planFor(u) {
    const WINNOW = winnow();
    if (!WINNOW.keep.length) {
      // 勾到的带被数域/模式全判死：这不是版面能救的，缩砖也没用——照内核的口径把话说清
      throw new Error(T('statFatal') + LJS(WINNOW.dead.map((d) => `${d.label}${LANG === 'en' ? ' — ' : '——'}${d.reason}`)));
    }
    // 一页两卷时每一"半页"都自带页眉/说明/页脚，所以固定开销按卷数计，不能整体除以 2
    const pageH = S.per === 2 ? GEO.h2 : GEO.h;
    /* 学生卷与答案页共用同一个盘面尺寸，所以可用高度取两边开销的较大者：
       答案页没有说明块和页脚，但多一行推导写式（GEO.eqline）。勾了"无说明＋无页脚"时
       学生卷的开销反而比答案页小，一页两卷的半页只剩 127mm，那 5.1mm 就真能顶出去。 */
    const stOver = (S.hdr ? GEO.hd : 0) + ruleH() + (S.foot ? GEO.ft : 0);
    const anOver = S.ans ? (S.hdr ? GEO.hd : 0) + GEO.eqline : 0;
    const availH = pageH - Math.max(stOver, anOver) - slackMM();
    const mk = () => WINNOW.keep.map((key) => {
      const b = K.band(key);
      const m = bandMetrics(b, u);
      return { key, L: b.L, shape: b.shape, label: b.label,
        cols: K.colsFor(b.L, b.shape), rows: 1, one: +m.one.toFixed(2), u: +u.toFixed(2), h: +m.h.toFixed(2) };
    });
    const bandsH = (bs) => bs.filter((b) => b.rows).reduce((s, b) => s + b.rows * b.one + (b.rows - 1) * GEO.bandGap, 0)
      + Math.max(0, bs.filter((b) => b.rows).length - 1) * (GEO.bandGap + 2);
    const total = (bs) => bs.reduce((s, b) => s + b.cols * b.rows, 0);
    const cap = wallsCap();                   // 每页最多 30 面（一页两卷＝每卷 15 面），第 3 条
    const fresh = mk();
    fresh.forEach((b) => { b.per = b.cols * b.rows; });
    /* "每带各一行"塞不下 → 自动撑满这一路没得排，缩砖重来。
       固定每页墙数那一路不走这条：它的解本来就可能只排一部分带，判据是函数末尾那一条。 */
    if (!(S.walls > 0) && bandsH(fresh) > availH) {
      LAST_FAIL = {
        u: +u.toFixed(2), need: +bandsH(fresh).toFixed(1), avail: +availH.toFixed(1),
        board: +bandsH(fresh).toFixed(1), walls: total(fresh),
      };
      return null;
    }
    const greedy = (bs, lim) => {
      lim = lim === undefined ? cap : lim;
      for (let guard = 0, rot = 0; guard < 80; guard++) {
        let added = false;
        /* 轮流加行，不是"谁矮一直加谁"：只勾两层3块和三层时，后者一行比前者高，
           一直补矮的那一带会排成 42 面两层 + 3 面三层，一节课练的全是最浅的墙。
           按带序（易→难）轮转，轮到谁谁加；这一轮谁都加不进就收工。
           每页上限（第 3 条）和高度一样是硬闸：撞满 30 面就停，剩下的空白留给大砖。*/
        for (let t = 0; t < bs.length && !added; t++) {
          const b = bs[(rot + t) % bs.length];
          b.rows++; b.per = b.cols * b.rows;
          if (bandsH(bs) <= availH && total(bs) <= lim) { added = true; rot = (bs.indexOf(b) + 1) % bs.length; }
          else b.rows--; b.per = b.cols * b.rows;
        }
        if (!added) break;
      }
      return total(bs);
    };
    if (!(S.walls > 0)) {
      const bs = fresh;
      /* 「还能再加一行，但再加就超 30 面」要说得出证据：拿同一批不带、不设上限再贪心一遍。
         上限比版面还紧时，这一遍的面数就是"版面本来能给几面"，状态条拿它跟 30 对照。*/
      const full = greedy(mk(), Infinity);      // 不设上限能排几面：capCut 的证据
      const got = greedy(bs, cap);
      return { bands: bs, total: got, availH: +availH.toFixed(1), task: +bandsH(bs).toFixed(1),
        capCut: full > got, autoFull: full, auto: full, winnowed: WINNOW.dead };
    }
    const auto = greedy(mk(), Infinity);              // 撑满能排几面：状态条要拿它跟用户填的数对照
    const bs = mk();
    /* 面数分配：一行就是 cols 面（两层3块 5 面、两层多块 4 面、三～五层各 3 面），所以"每页 8 面"未必凑得整。
       在 Σ cols_i × 行数 = s（s ≤ n）的所有解里挑一个，比较顺序是：
         ① 最容易的几带连续露面（前缀最长）——从易到难是这一卷的骨架，别为了凑数把两层3块整带挤掉；
         ② 露面的带更多；③ 各带行数更平均（不要一个带排五行、别的都一行）；④ 还是不行就容易的排得多。
       凑不到 n 就退而求其次取 n−1、n−2…（状态条会点名差几面），一个都凑不出（n 比最小一行还小）
       就排"行数最少的那一带一行"，实际面数比 n 多，也照样说清楚。
       n 先被每页上限夹一道（第 3 条）：填 30 面又勾一页两卷，每卷只排 15 面，状态条说清是谁夹的。*/
    const want = S.walls, n = Math.min(want, cap), clipped = want - n;
    const score = (v) => {
      let pre = 0;
      while (pre < v.length && v[pre] > 0) pre++;
      return [pre, v.filter((x) => x > 0).length, -Math.max.apply(null, v.concat([0]))].concat(v);
    };
    const better = (a, b) => {
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i];
      return false;
    };
    const best = new Array(n + 1).fill(null);
    best[0] = bs.map(() => 0);
    for (let s = 0; s <= n; s++) {
      if (!best[s]) continue;
      bs.forEach((b, i) => {
        const t = s + b.cols;
        if (t > n) return;
        const v = best[s].slice(); v[i]++;
        if (!best[t] || better(score(v), score(best[t]))) best[t] = v;
      });
    }
    let rows = null, got = 0;
    for (let s = n; s >= 1; s--) if (best[s]) { rows = best[s]; got = s; break; }
    if (!rows || !got) {                             // n 比最小的一行还小
      const s = bs.slice().sort((a, b) => a.cols - b.cols)[0];
      rows = bs.map((b) => (b.key === s.key ? 1 : 0));
    }
    bs.forEach((b, i) => { b.rows = rows[i]; b.per = b.cols * b.rows; });
    const placed = bs.filter((b) => b.rows);
    if (!placed.length) return null;
    if (bandsH(bs) > availH) {
      LAST_FAIL = {
        u: +u.toFixed(2), need: +bandsH(bs).toFixed(1), avail: +availH.toFixed(1),
        board: +bandsH(bs).toFixed(1), walls: total(bs), want, fixed: n,
      };
      return null;
    }
    const real = total(bs);
    return { bands: bs, total: real, availH: +availH.toFixed(1), task: +bandsH(bs).toFixed(1),
      fixed: n, auto, short: Math.max(0, n - real), over: Math.max(0, real - n), clipped,
      dropped: bs.filter((b) => !b.rows).map((b) => b.label), winnowed: WINNOW.dead };
  }

  /* ================= 渲染 ================= */
  /* 空砖在卷面上就是一个空白格子（用户 2026-11-17 第 4 条"空的砖块空白就好"）：
     学生页用 .hv（无底色），教师卷的答案砖另用 .a（浅蓝底 + accent 字）——
     这两个类必须分开，判据一边查"学生页的空砖不许带底色"，一边查"答案页填上的砖对得上"。 */
  function brickHTML(st, c, answered) {
    const hid = st.hidden.has(c.i);
    return `<i class="bk${hid ? (answered ? ' a' : ' hv') : ''}">${hid && !answered ? '' : c.val}</i>`;
  }
  function structHTML(st, idx, answered) {
    let rows = '';
    for (let d = 0; d < st.L; d++) {
      const cs = st.cells.filter((c) => c.row === d).sort((a, b) => a.col - b.col);
      // 错缝：第 d 行整体右移 (L−1−d)/2 个砖宽，用 ch 当单位不行——砖宽是 mm，直接算 mm
      // 答案页缩砖时位移要跟着缩，否则错缝的"半块"对不上下一行
      const uu = answered ? st._u * ANS_K : st._u;
      const off = ((st.L - 1 - d) * 0.5 * uu).toFixed(2);
      rows += `<div class="brow" style="margin-left:${off}mm">${cs.map((c) => brickHTML(st, c, answered)).join('')}</div>`;
    }
    /* 组标签只剩序号：v3 把「几层」和入门形的"分与合/口诀"都删掉了（用户第 3 条），
       形状的信息在带那一行的分组里天然看得见——同一带的墙长得一样。
       带序号超过 ㉚ 就换成阿拉伯数字：42 面一页是常态，绕回 ① 会让老师喊"第①面"时两头跑。*/
    const lab = `<div class="glabel"><b>${idx < CIRC.length ? CIRC[idx] : idx + 1}</b></div>`;
    // 教师卷在墙下面补一行推导（学生卷这一栏已经取消）
    const eq = answered ? `<div class="eqrow"><span class="eqs">${st.log.slice(0, 3).map((e) => `<span class="eq">${K.eqOf(st, e)}</span>`).join('')}</span></div>` : '';
    return `<div class="group" style="--u:${(answered ? st._u * ANS_K : st._u).toFixed(2)}mm;` +
      `--bh:${(answered ? st._h * ANS_K : st._h).toFixed(2)}mm">${lab}<div class="wall">${rows}</div>${eq}</div>`;
  }
  /* 对错示例的那两幅数字（用户 2026-11-17 第 5 条：原来那幅错例"底 3、4、4 → 顶 7、8"
     算式其实全对，只是被标了个 ✗，孩子看不出错在哪）。
     现在两幅都画三块砖的入门形、同一面墙只差顶上那个数：对例 3+4=7；错例写 6（差 1，一眼看得见）。
     乘法档底下同样两块砖，错例写成 3+4=7——"把乘做成加"正是这一档最常见的错。
     形状取三块砖不是因为只勾了「两层3块」：错缝墙上"一块砖压在相邻两块正中"就是这同一句几何，
     示例画得跟卷面最简的那一级一样，孩子照着填第一面墙就能对上。
     这一份数字同时进 diag.demo：判据要钉住"错例必须真的算错"，别让下次改词又把算式改回全对。*/
  function demoFig() {
    const mul = S.op === 'mul';
    const right = mul ? 3 * 4 : 3 + 4;
    return { kids: [3, 4], okTop: right, badTop: mul ? 3 + 4 : right - 1 };
  }
  function rulebarHTML() {
    const mul = S.op === 'mul';
    const row = (arr, off, bad) => `<div class="drow">${arr.map((v, j) =>
      `<i${j === bad ? ' class="h"' : ''} style="margin-left:${j ? 0 : off}mm">${v}</i>`).join('')}</div>`;
    const F = demoFig();
    const demo = (ok) => {
      const t = ok ? F.okTop : F.badTop;
      return `<div class="demo${ok ? '' : ' bad'}">${row([t], 3.1, ok ? -1 : 0)}${row(F.kids, 0)}<span class="dcap">${ok ? TXT.demoOkCap : TXT.demoBadCap}</span></div>`;
    };
    return `<div class="rulebar">` +
      `<div class="rseg"><span class="tag">${TXT.ruleTag}</span>${mul ? TXT.ruleHowMul : TXT.ruleHow}</div>` +
      (miniRule() ? '' : `<div class="rseg demos">${demo(true) + demo(false)}</div>`) + `</div>`;
  }
  /* 裁开线：插在"上半页"和"下半页"之间的那个 10mm 缝里（用户 2026-11-18 挑的方案 C1，
     做法与样式取自数格涂涂的 .cut）。
     为什么必须是流里的块、不能绝对定位挂进卷面：草稿量过——挂进卷面的那版（C3）会把上半页的
     scrollHeight 顶高 10.05mm，而"半页溢出"正是全链的判据（verify_sample/sweep 都读它），
     等于为了少一个 DOM 节点把整条链点红；线自己占满那 10mm、页 margin-bottom 归零才是对的
     （读数与页数对照见 out/裁开线草稿_measure.log）。 */
  function cutlineHTML() {
    return S.per === 2 ? `<div class="cutline"><i></i><span>${TXT.cutline}</span><i></i></div>` : '';
  }
  function sheetHTML(sh, copy) {
    const bands = sh.bands.map((b) =>
      `<div class="band" style="gap:${GEO.bandGap}mm">${Array.from({ length: b.rows }).map((_, r) =>
        `<div class="browr">${Array.from({ length: b.cols }).map((_, c2) => {
          const st = sh.structs[b.start + r * b.cols + c2];
          return st ? structHTML(st, b.start + r * b.cols + c2, false) : '';
        }).join('')}</div>`).join('')}</div>`).join('');
    /* 卷头那个"最大 N"取 maxShown（只看得见的那些砖里的最大值）：两层3块只勾"合"时
       挖的就是顶砖，用全体最大值就是把答案印在卷头上。 */
    /* 卷头那串"2+3 层"按这一页真排出来的带算（不是按勾选算）：被数域收敛掉的层数、
       或每页墙数太少而一行都塞不进的层数，都不该出现在卷头上——孩子翻遍卷面也找不到那一层。 */
    const lays = [...new Set(sh.bands.filter((b) => b.rows).map((b) => b.L))].sort((a, b) => a - b).join('+');
    const hd = S.hdr ? `<div class="hd"><div><span class="ttl">${TXT.title}</span><span class="sub">${S.op === 'mul' ? TXT.subMul : TXT.sub} · <b>${TXT.ansRule(sh.maxShown)}</b> · ${F('paperLayers', { lays })}</span></div>` +
      `<div class="meta"><span class="line">${TXT.metaName}</span><span class="line">${TXT.metaTime}</span></div></div>` : '';
    const board = `<div class="wallzone">${bands}</div>`;
    /* 一页两卷：每张纸的上半页（copy 是奇数那一卷）后面紧跟着裁开线，线后面才是下半页。
       答案页用同一把尺子（ansPageHTML 里的 i % 2 === 0）。 */
    const first = S.per === 2 && copy % 2;
    return `<section class="sheet${S.per === 2 ? ' two' + (first ? ' nobrk' : '') : ''}" data-copy="${copy}">` +
      hd + (S.rule !== 'off' ? rulebarHTML() : '') + board +
      (S.foot ? `<div class="ft"><span class="tag">${T('paperCheckTag')}</span><span>${TXT.ft}</span><span class="seed">${TXT.seedFmt(S.seed)}</span></div>` : '') +
      `</section>` + (first ? cutlineHTML() : '');
  }
  /* 答案页先出"页的内容"，纸张外壳（整页还是半页、要不要翻页）交给 ansPageHTML 统一装配：
     一页两卷时一张纸要放两卷的答案，分页序号和 .two/.nobrk 得按"跨卷的答案页总序列"配对，
     不能各卷自己算自己的奇偶，否则两卷的答案各占一张纸的下半页，裁开对不上。 */
  function ansParts(sh) {
    /* 答案页按"行"装页，不是按带装页。两个坑都踩过：
       1) 一带一页太浪费——两层带只有几十毫米高，独占一张纸等于烧纸（用户要"别浪费"）；
       2) 只按带切页会卡死：纯黑板面（页眉/说明/页脚都不印）时盘面能排到 11 行，
          一整带 11 行远超一页容量，而"放不下就另起一页"只在 cur 非空时触发，
          于是整带被硬塞在一页上，答案页溢出 55mm，解算器把每一档砖宽都判死 → 整版出不了题。
       所以先把带拆成行段（每段不超过一页），再按行段贪心装页；序号顺着原始行号往下编。*/
    const pageH = S.per === 2 ? GEO.h2 : GEO.h;
    const cap = pageH - GEO.hd - (S.per === 2 ? GEO.slack2 : 6);
    const rowH = (b) => ansOne(b) + GEO.bandGap;
    const parts = [];
    sh.bands.forEach((b) => {
      const perPage = Math.max(1, Math.floor(cap / rowH(b)));
      for (let done = 0; done < b.rows; done += perPage) {
        parts.push({ b, from: done, rows: Math.min(perPage, b.rows - done) });
      }
    });
    const pages = [];
    let cur = [], used = 0;
    parts.forEach((p) => {
      const h = p.rows * rowH(p.b);
      if (cur.length && used + h > cap) { pages.push(cur); cur = []; used = 0; }
      cur.push(p); used += h;
    });
    if (cur.length) pages.push(cur);
    return pages.map((ps) => ({
      bands: ps.map((p) => {
        const b = p.b;
        return `<div class="band" style="gap:${GEO.bandGap}mm">${Array.from({ length: p.rows }).map((_, r) =>
          `<div class="browr">${Array.from({ length: b.cols }).map((_, c2) => {
            const i = b.start + (p.from + r) * b.cols + c2, st = sh.structs[i];
            return st ? structHTML(st, i, true) : '';
          }).join('')}</div>`).join('')}</div>`;
      }).join(''),
      what: LTS(ps.map((p) => {
        const n = p.rows * p.b.cols;
        return `${p.b.label} ${F('paperWallsOf', { n, z: PL(n) })}`;
      })),
      maxVal: sh.maxVal,
    }));
  }
  function ansPageHTML(pg, i, hasNext) {
    /* 半页答案页与学生卷同一套配对：偶数下标那半张不留分页符（.nobrk），两张拼满一张 A4。
       裁开线只在"下面确实还有半页"时印——各卷答案页数不等时跨卷序列可能是单数，
       末尾那半张没有下半页，线留在纸尾等于让老师往空白处下剪刀。 */
    const first = S.per === 2 && i % 2 === 0;
    const cls = S.per === 2 ? ' two' + (i % 2 ? '' : ' nobrk') : '';
    return `<section class="sheet anssheet${cls}"><div class="hd"><div><span class="ttl">${TXT.title}</span>` +
      `<span class="sub">${TXT.ansTag} · ${pg.what} · ${TXT.ansRule(pg.maxVal)}</span></div>` +
      `<div class="meta"><span class="line">${TXT.seedFmt(S.seed)}</span><span class="line">${S.op === 'mul' ? TXT.mulTag : TXT.addTag}</span></div></div>` +
      `<div class="wallzone">${pg.bands}</div></section>` + (first && hasNext ? cutlineHTML() : '');
  }
  /* 兼容旧调用名：一卷的答案页直接拼成字符串（样张脚本里还有地方按这个口径读）。*/
  function ansSheets(sh) { return ansParts(sh).map((pg, i) => ansPageHTML(pg, i)).join(''); }

  /* ================= 溢出测量与解算主循环 ================= */
  function sheetsEl() { return Q('stage'); }
  function buildSheets(views) {
    /* 答案页跨卷统一编号：一页两卷时第 1、2 张答案半页拼成一张纸，第 3、4 张拼成下一张。
       按卷各自编号会让每张纸的下半页各摊上一卷的答案，裁开对不上位。
       先把各卷答案页摊平成一条序列，才能在生成每半页时知道"后面还有没有半页"（裁开线的条件）。 */
    const ansPartsAll = [];
    if (S.ans) views.forEach((v) => ansParts(v.sh).forEach((pg) => ansPartsAll.push(pg)));
    const ans = ansPartsAll.map((pg, i) => ansPageHTML(pg, i, i + 1 < ansPartsAll.length));
    sheetsEl().innerHTML = views.map((v, i) => sheetHTML(v.sh, i + 1)).join('') + ans.join('');
  }
  /* 溢出有两个独立信号，取大的那个：
     1) scrollHeight − clientHeight：Chromium 一路都认；
     2) 子块矩形相对版心边的越界量：不看 overflow 怎么算，WebKit（Safari）在
        overflow:hidden 下可能把 scrollHeight 算成裁切后的值，只信 1) 就会"量不到溢出"。
     数格涂涂在 Safari 上吃过的亏就是只信了 1)。 */
  function overflowMM() {
    let worst = 0, el = '';
    [].forEach.call(sheetsEl().querySelectorAll('.sheet'), (s) => {
      const cs = getComputedStyle(s), r = s.getBoundingClientRect();
      const top = r.top + parseFloat(cs.paddingTop), bot = r.bottom - parseFloat(cs.paddingBottom);
      const lf = r.left + parseFloat(cs.paddingLeft), rt = r.right - parseFloat(cs.paddingRight);
      let vOver = 0, hOver = 0;
      [].forEach.call(s.children, (n) => {
        const b = n.getBoundingClientRect();
        if (!b.width && !b.height) return;
        vOver = Math.max(vOver, b.bottom - bot, top - b.top);
        hOver = Math.max(hOver, b.right - rt, lf - b.left);
      });
      const ov = Math.max((s.scrollHeight - s.clientHeight) * MM, vOver * MM);
      if (ov > worst) { worst = ov; el = s.className + '/' + s.dataset.copy; }
      const ovw = Math.max((s.scrollWidth - s.clientWidth) * MM, hOver * MM);
      if (ovw > worst) { worst = ovw; el = s.className + '(宽)'; }
    });
    return { over: worst, el };
  }

  let FLOOR_OVER = 0, TOLF = 0.2, OVER_EL = '';

  /* 量测自检：故意在纸的底边外挂一块 40mm 的内容，看溢出读数跟不跟得上。
     用绝对定位是因为普通子块会被 flex 的伸缩性吃掉（试过：注入 40mm，wallzone 自己缩了，
     溢出量还是 0——那测的是弹性布局的 absorb，不是量测的灵敏度）。
     跟得上才说明"溢出 0.00"是真话；跟不上就得把"量不准"喊出来，不能拿假信号当撑满。 */
  function selfTest() {
    const s = sheetsEl().querySelector('.sheet');
    if (!s) return null;
    const before = overflowMM().over;
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;left:0;top:100%;width:10mm;height:40mm';
    s.appendChild(d);
    const after = overflowMM().over;
    d.remove();
    return { ok: after - before >= 30, before: +before.toFixed(2), after: +after.toFixed(2) };
  }

  /* 噪声底：先把版心故意让出 60mm（明显留白）画一遍。这时候任何正溢出都不可能是内容太多，
     只可能是浏览器自己的舍入——Safari 那约 0.1mm 的固定残差就是在这里被量出来计入容差的。
     数格涂涂 2026-11-15 的教训：不量噪声底、直接用固定 0.2mm 容差，Safari 会把版面砸小一档。 */
  function calibrate(seeds, u) {
    CAL_EXTRA = 60;
    let v = null, cu = u, g = 0;
    while (!v && cu > U_HARD && g++ < 60) { v = buildAll(seeds, cu); cu = Math.round((cu - 0.5) * 100) / 100; }
    FLOOR_OVER = v ? Math.max(0, overflowMM().over) : 0;
    CAL_EXTRA = 0;
    TOLF = Math.max(0.2, Math.min(FLOOR_OVER + 0.05, 1.0));
    return FLOOR_OVER;
  }

  function makeView(seed, u) {
    const plan = planFor(u);
    if (!plan) return null;
    let start = 0;
    plan.bands.forEach((b) => { b.start = start; start += b.per; });
    const o = { op: S.op, ranges: S.ranges.slice(), tops: S.tops.slice(), dir: S.dir.slice(), diff: S.diff };
    const sh = K.generate(seed, o, plan.bands);
    sh.bands = plan.bands;
    sh.total = plan.total;
    sh.planH = plan.task; sh.availH = plan.availH;
    /* 固定"每页墙数"那一路的账：撑满本来能排几面、比你要的少几面、哪些带因为一行都塞不进没排。
       状态条靠它把"为什么不是 8 面"说清楚，不许让人对着空白的下半页猜。*/
    sh.fixed = plan.fixed || 0; sh.auto = plan.auto || 0;
    sh.short = plan.short || 0; sh.wallsOver = plan.over || 0; sh.clipped = plan.clipped || 0;
    /* 自动撑满被每页 30 面这道顶截住了（版面还能再加一行）——状态条要说"是上限拦的，不是排不下"。*/
    sh.capCut = !!plan.capCut; sh.autoFull = plan.autoFull || 0;
    sh.wallsCap = wallsCap();
    sh.bandsDropped = plan.dropped || [];
    /* 数域/模式判死的带压根没进这份 plan（一行都没占），但"自动收敛"那句还得说：
       补进 dropped，状态条（kernelNotes）和判据读的是同一个字段，不许页面喊了机器看不见。 */
    if (plan.winnowed && plan.winnowed.length) {
      const have = new Set((sh.dropped || []).map((d) => d.key));
      sh.dropped = (sh.dropped || []).concat(plan.winnowed.filter((w) => !have.has(w.key)));
    }
    sh.maxU = +u.toFixed(2);
    sh.structs.forEach((st) => {
      // 必须按 key 找带：两层3块和两层多块同为 L=2，按 L 找会把砖宽挂错
      const b = plan.bands.find((x) => x.key === st.key);
      st._u = b ? b.u : u; st._h = b ? b.h : u * HR;
    });
    return { sh, plan };
  }
  function buildAll(seeds, u) {
    const built = seeds.map((s) => makeView(s, u));
    if (built.some((b) => !b)) return null;      // 这个砖宽连"每带各一行"都塞不下
    ansFit(built.map((v) => v.sh));              // v4.0：一页一卷时把每卷答案压进一页（只缩砖）
    buildSheets(built);
    return built.map((v) => v.sh);
  }

  /* 底部还剩多少没用上的空间：.sheet 是定高的 flex 容器、页脚靠 margin-top:auto 贴底，
     所以剩余空间不表现为溢出，而表现为"子块之间的缝"。这里量缝的和（不是子块高度之和——
     子块高度那套算法会把 auto 边距也算成内容，剩余永远为 0，这个坑踩过一次）。 */
  function airMM() {
    let worst = 0, el = '';
    [].forEach.call(sheetsEl().querySelectorAll('.sheet'), (s) => {
      if (s.classList.contains('anssheet')) return;
      const cs = getComputedStyle(s), sr = s.getBoundingClientRect();
      const top = sr.top + parseFloat(cs.paddingTop), bot = sr.bottom - parseFloat(cs.paddingBottom);
      const kids = [].map.call(s.children, (n) => n.getBoundingClientRect()).sort((a, b) => a.top - b.top);
      if (!kids.length) return;
      let free = (top - kids[0].top) + (bot - kids[kids.length - 1].bottom);
      for (let i = 1; i < kids.length; i++) free += Math.max(0, kids[i].top - kids[i - 1].bottom);
      free *= MM;
      if (free > worst) { worst = free; el = s.className; }
    });
    return { air: worst, el };
  }

  /* 解算：砖宽从横向上限往下逐档试，选档标准按用户那句"最大限度利用空间、砖块不要过大过宽"排：
     1) 先比题量——同一页能多排一行墙就多练几面，面数多的档胜出；
     2) 面数相同时取先试到的大砖档（不为多两毫米空气把砖缩一号）；
     3) 可读下限（9.5mm）以上的档全塞不下时，才走 7–9.5mm 的退路，并在页面上写明砖是缩出来的。 */
  function fitViews(seeds) {
    /* 砖宽上限按"真会排出来的带"算：被数域判死的带（只勾 10以内时的五层）一行都不会露面，
       不该拿它 18 个砖宽的行把整页的砖压小一档。 */
    const wk = winnow();
    const cap = widthCap(wk.keep.length ? wk.keep : S.bands);
    const u0 = Math.min(U_CAP, cap * (S.cell === 'minus' ? 0.86 : S.cell === 'plus' ? 1.06 : 1));
    calibrate(seeds, u0);
    const ladder = [];
    for (let u = u0; u >= U_FLOOR - 1e-9; u = Math.round((u - 0.35) * 100) / 100) ladder.push(u);
    for (let u = Math.min(U_FLOOR, u0); u >= U_HARD - 1e-9; u = Math.round((u - 0.25) * 100) / 100) ladder.push(u);
    let best = null;
    window.__tries = [];                                // 解算台帐：量测不对时先看这里
    for (const u of ladder) {
      const views = buildAll(seeds, u);
      if (!views) { window.__tries.push({ u, fit: false }); continue; }   // 连"每带各一行"的最小配置都塞不下
      const m = overflowMM(); OVER_EL = m.el;
      const a = airMM();
      window.__tries.push({ u, rows: views[0].bands.map((b) => b.rows).join('/'), walls: views[0].total, model: views[0].planH, over: +m.over.toFixed(2), air: +a.air.toFixed(1) });
      if (m.over > TOLF) continue;                      // 模型说装得下、真渲染装不下：这档不算
      const small = u < U_FLOOR - 1e-9;
      /* 可读下限是硬边界：下面的档只在"下限以上一档都没量出可用版面"时才走，
         绝不为了多排两面墙把砖缩到孩子写不下（试过不设限，四层卷会缩到 7.2mm）。 */
      if (small && best) break;
      /* 比的是**不重复**的题量（用户 2026-11-22 第 3 条：交换因数算同一道，一页只出一次）——
         勾了口诀后池子可能比一页名额小，撞出来的那几面不该算练题量：
         不能让"多排两面重复题"赢过"少排但每道都新"，那样只会把砖白白缩一号。
         平手时取"总面数少的那一档"：uniq 一样就意味着 total 越小 dups 越少，
         重复正是用户要避免的东西（第一版只比 uniq，勾 9 的 30 面卷里 6 面是重印的，
         状态条虽然喊了，但明明有一档只重印 1 面——判据 sweep「同页撞了同一道题」逮的就是这个）。 */
      const uniq = views.reduce((s, v) => s + v.total - (v.dups || 0), 0);
      const all = views.reduce((s, v) => s + v.total, 0);
      if (!best || uniq > best.total || (uniq === best.total && all < best.all))
        best = { views, u, over: m.over, air: a.air, airEl: a.el, total: uniq, all, small };
      /* 定了每页墙数就反过来选档：ladder 是从大砖往下排的，第一档装得下 n 面就是"能装下的最大砖"，
         再往下缩只会把砖做小、空气做多——固定墙数要的就是大砖。 */
      if (S.walls > 0) break;
      if (best.air < 3) break;                      // 已经顶到边了，不为 2mm 继续缩
    }
    if (!best) return { views: null, u: U_HARD, over: 0, air: 0, floor: FLOOR_OVER, tol: TOLF, stuck: true, small: true };
    /* 固定每页墙数时再替砖争取一次（用户 2026-11-17 第 1、3 条）：横向预算按"勾到的带"算，
       可 DP 最后只让其中几带排上行，没露面的带（rows=0）不该继续把砖压小——五带全勾、只要 8 面时
       只有两层3块和三层露面，四五层那两道"18 个砖宽"的预算纯属冤枉砖。
       用露面带的宽度上限再解一次：装得下就换档，装不下（高度先撞）就保留原来那档。
       只多跑一次，不迭代——迭代会在"少一带露面 ↔ 砖变大 → 又少一带"之间来回抖。 */
    if (S.walls > 0) {
      const placed = best.views[0].bands.filter((b) => b.rows).map((b) => b.key);
      const k = S.cell === 'minus' ? 0.86 : S.cell === 'plus' ? 1.06 : 1;
      const cap2 = placed.length ? Math.min(U_CAP, widthCap(placed) * k) : 0;
      const u2 = Math.floor((cap2 + 1e-9) / 0.35) * 0.35;      // 回到 0.35mm 的阶梯上
      if (u2 > best.u + 0.01 && u2 >= U_FLOOR - 1e-9) {
        const views2 = buildAll(seeds, u2);
        if (views2) {
          const m2 = overflowMM(), a2 = airMM();
          window.__tries.push({ u: u2, retry: true, rows: views2[0].bands.map((b) => b.rows).join('/'),
            walls: views2[0].total, model: views2[0].planH, over: +m2.over.toFixed(2), air: +a2.air.toFixed(1) });
          if (m2.over <= TOLF) best = { views: views2, u: u2, over: m2.over, air: a2.air, airEl: a2.el,
            total: views2.reduce((s, v) => s + v.total, 0), small: u2 < U_FLOOR - 1e-9 };
        }
      }
    }
    buildAll(seeds, best.u);                        // DOM 要停在选中的那一档，不是最后试过的那档
    return { views: best.views, u: best.u, over: best.over, air: best.air, airEl: best.airEl, small: best.small, floor: FLOOR_OVER, tol: TOLF, stuck: false };
  }

  /* ================= 主流程 ================= */
  function fatalPanel(msg) {
    sheetsEl().textContent = '';
    const f = document.createElement('div');
    f.className = 'fatal';
    f.textContent = msg;
    sheetsEl().appendChild(f);
  }

  /* 塞不下时该说什么：把"差多少毫米"和"往回退哪一步"讲清楚。
     只说"版面溢出"老师没法操作，光把砖缩到 6mm 又是把题做坏。 */
  function noFitMsg(f) {
    const way = S.per === 2 ? T('noteWayPer2') : T('noteWayPer1');
    const names = LS(K.BAND_ORDER.filter((k) => S.bands.includes(k)).map((k) => K.band(k).label));
    if (S.walls > 0 && f.want) {
      const n = f.fixed || f.want;
      const by = n < f.want ? F('noteCapClamp', { n, want: f.want }) : '';
      return F('noteNoFitWant', { way, by, n, names, need: f.need, avail: f.avail, u: f.u });
    }
    return F('noteNoFitMin', { way, avail: f.avail, names, walls: f.walls, need: f.need, u: f.u });
  }

  /* 内核回传的三类"没静默"：数域把某一带收敛掉了、同页去重退了洞、去重彻底撞车。*/
  function kernelNotes(views) {
    const warn = [];
    const dropMap = new Map();
    views.forEach((sh) => (sh.dropped || []).forEach((d) => { if (!dropMap.has(d.key)) dropMap.set(d.key, d.reason); }));
    if (dropMap.size) warn.push(T('noteAutoShrink') + LJS([...dropMap].map(([k, r]) => `${K.band(k).label}${LANG === 'en' ? ' — ' : '——'}${r}`)));
    const dups = views.reduce((a, s) => a + (s.dups || 0), 0);
    /* 乘法勾了口诀（用户 2026-11-22）：题量池由内核枚举给出，撞车那句要说"口诀只有几道"，
       不能沿用加减法那句"换个数域"——数域在乘法里根本不管用。*/
    const mulT = S.op === 'mul' && S.tops.length > 0;
    const facs = mulT ? K.mulFactorSet(S.tops) : [];
    const poolBands = mulT ? K.BAND_ORDER.filter((k) => S.bands.includes(k)) : [];
    const poolN = poolBands.reduce((a, k) => a + K.mulFactCount(k, facs), 0);
    if (dups) warn.push(mulT
      ? F('noteDupMul', { dups, zd: PL(dups), poolN })
      : F('noteDupAdd', { dups, zd: PL(dups), bands: S.bands.length }));
    const shrunk = views.reduce((a, s) => a + (s.shrunk || 0), 0);
    if (shrunk) warn.push(F('noteShrunk', { shrunk, zs: PL(shrunk) }));
    const deg = views.reduce((a, s) => a + (s.degraded || 0), 0);
    if (deg) warn.push(F('noteDegraded', { deg, zd: PL(deg) }));
    /* 顶砖细分生效时把话说全：限的是哪几个数、只裁 10以内 这一档、同勾 10以上 时那档照旧。
       这句是屏上的话（状态条 + diag.notes），纸面卷头仍然只印用户给的"砖上的数最大 N"。 */
    if (S.op !== 'mul' && S.tops.length) {
      const other = S.ranges.filter((r) => r !== 'le10').map((r) => K.RANGES[r].label);
      warn.push(F('noteTopsLimit', {
        list: LS(S.tops),
        other: other.length ? F('noteTopsLimitOther', { other: other.join('/') }) : '',
      }));
    }
    /* 乘法下同一排读作"几的乘法口诀"（用户 2026-11-22 第 1 条选的是"至少一步含勾到的数"）：
       这句要把三件事说明白——筛的是因数、另一个因数不限（所以会顺带练到别的口诀）、题量池有多大。
       勾到 1／10 也在这里点名，不悄悄丢掉（第 2 条）。*/
    if (mulT) {
      const dead = K.mulDeadTops(S.tops);
      warn.push(F('noteFactLimit', { facs: LS(facs) || T('noteFactNone') }) +
        F('notePoolCount', { pool: LS(poolBands.map((k) => F('notePoolItem', { label: K.band(k).label, n: K.mulFactCount(k, facs) }))) }) +
        (dead.length ? F('noteFactDead', { dead: LS(dead) }) : ''));
      /* 某个带用不到的那几个数（三层里的 5、7）：带不收敛，但必须按带点名（第 4 条） */
      poolBands.forEach((k) => {
        const live = K.mulLiveFacts(k, facs);
        if (live.length && live.length < facs.length) {
          warn.push(F('noteBandNoFact', {
            label: K.band(k).label,
            dead: LS(facs.filter((f) => !live.includes(f))),
            live: LS(live),
          }));
        }
      });
    }
    return warn;
  }

  /* 「每页墙数」这一路 + 每页 30 面这道顶的"没静默"（和 kernelNotes 同一口径：状态条说什么，
     diag.notes 就回传什么，sweep/WebKit 判据读的是后者——页面上的字不许是机器看不到的字）。*/
  function wallsNotes(views) {
    if (!views.length) return [];
    const v0 = views[0], out = [];
    /* 一页两卷补卷（用户 2026-11-18"一页2卷并没有"）：凑满一张纸多出来的那一卷要说清楚是哪来的，
       不然老师拿到两张不同的题，会以为份数填错了。*/
    if (S.per === 2 && PAIR_PAD > 0) {
      out.push(F('notePadPairs', { copies: S.copies, zc: PL(S.copies), padded: S.copies + PAIR_PAD }));
    }
    if (!(S.walls > 0)) {
      if (v0.capCut) out.push(F('noteCapCut', { cap: v0.wallsCap, left: v0.autoFull - v0.total }));
      return out;
    }
    const colsIn = [...new Set(v0.bands.map((b) => b.cols))].sort((a, b) => a - b).join('/');
    if (v0.clipped) out.push(F('noteClipped', { fixed: v0.fixed, want: S.walls, cap: v0.wallsCap, half: S.per === 2 ? T('noteClippedHalf') : '' }));
    if (v0.short) out.push(F('noteShort', { total: v0.total, fixed: v0.fixed, cols: colsIn }));
    if (v0.wallsOver) out.push(F('noteOver', { total: v0.total, fixed: v0.fixed, over: v0.wallsOver }));
    if (v0.bandsDropped && v0.bandsDropped.length) out.push(F('noteDropped', { names: LS(v0.bandsDropped), fixed: v0.fixed }));
    return out;
  }

  /* 行内分布与空砖底色——用户 2026-11-17 第 1、2 条的机器钉子：
     rightAir 量"一行铺到哪儿为止"（最后一面墙的右边缘离版心右边还差几毫米，均匀分布就该是 0），
     gap 量行内缝的均值（不许为凑题量把缝压成一条线），holeBg 量空砖到底有没有印底色。
     这三样都从真渲染的盒子里读，代码里改了 CSS 忘了改判据、或反过来，都会当场红。 */
  function rowCheck() {
    let gapSum = 0, gapN = 0, air = 0, holeBg = null, holes = 0, rows = 0;
    [].forEach.call(sheetsEl().querySelectorAll('.sheet'), (sheet) => {
      if (sheet.classList.contains('anssheet')) return;
      const cs = getComputedStyle(sheet), rr = sheet.getBoundingClientRect();
      const right = rr.right - parseFloat(cs.paddingRight);
      [].forEach.call(sheet.querySelectorAll('.browr'), (row) => {
        const kids = [].filter.call(row.children, (n) => n.getBoundingClientRect().width);
        if (kids.length < 2) return;
        rows++;
        for (let i = 1; i < kids.length; i++) {
          gapSum += (kids[i].getBoundingClientRect().left - kids[i - 1].getBoundingClientRect().right) * MM;
          gapN++;
        }
        air = Math.max(air, (right - kids[kids.length - 1].getBoundingClientRect().right) * MM);
      });
      const h = sheet.querySelector('.bk.hv');
      if (h) { holes += sheet.querySelectorAll('.bk.hv').length; if (holeBg === null) holeBg = getComputedStyle(h).backgroundColor; }
    });
    return { rows, gap: gapN ? +(gapSum / gapN).toFixed(2) : null, rightAir: +Math.max(0, air).toFixed(2),
      holes, holeBg };
  }

  function render() {
    syncBands(); syncRanges(); syncTops();
    syncBar();                                  // 按钮显示永远跟着状态走（点了没反应那类 bug 就堵在这）
    if (S.rule === true) S.rule = 'full';
    if (S.rule === false) S.rule = 'off';

    /* 一页两卷·裁开（用户 2026-11-18："一页2卷并没有"）：这张纸真的要有两卷，不是把一卷压成半页
       留半张空白。所以卷数按"向上凑偶、至少 2"来：份数 1 → 出 2 卷拼满一张纸，份数 3 → 补成 4 卷。
       凑出来的那一卷是新题（种子往后挪），不是把上一卷重复印两遍——两遍一样的卷子老师直接
       用"份数 1 + 一页一卷"打两张就行，不必占着裁开口。凑对了要在状态条点名，不许静默加题。 */
    const nSheets = S.per === 2 ? Math.max(2, S.copies + (S.copies % 2)) : S.copies;
    PAIR_PAD = nSheets - S.copies;
    const seeds = Array.from({ length: nSheets }, (_, i) => (S.seed + i * 7919) >>> 0);
    LAST_FAIL = null;
    let err = '', res = null;
    try {
      res = fitViews(seeds);
      if (!res.views) { err = noFitMsg(LAST_FAIL || { avail: '?', need: '?', board: '?', walls: '?', u: '?' }); fatalPanel(err); }
    } catch (e) {
      err = T('statFatalHead') + e.message;
      fatalPanel(err);
    }
    const views = res && res.views ? res.views : [];
    const stCheck = views.length ? selfTest() : null;      // 溢出量测本身可不可信
    const diag = {
      build: BUILD, lang: LANG, seed: S.seed, opts: S, fatal: err || null,
      clickMiss: CLICK_MISS.slice(),
      /* 状态条上那几句"没静默"（自动收敛 / 退洞 / 重复 / 配比降级）也进诊断 JSON：
         sweep 要按配置断言"这条带被收敛掉了必须喊出来"，光看页面上的字没法机器判。 */
      notes: err ? [] : kernelNotes(views).concat(wallsNotes(views), ansNotes(views, res ? res.u : 0)),
      /* 选项区按钮的视觉状态：sweep 用它对账"显示＝配置"。
         只信 JS 里的 S 不算数——用户看得见的是那颗按钮有没有亮。 */
      bar: (() => {
        const rd = (id) => [].map.call(Q(id).children, (b) => [b.dataset.v, b.classList.contains('on'), !!b.disabled]);
        return { mode: rd('chipsMode'), bands: rd('chipsBands'), tops: rd('chipsTops'), walls: Q('walls').value.trim() };
      })(),
      /* 乘法口诀这一读法的机器读数（用户 2026-11-22 第 1–4 条）。为什么状态条那行字不够：
         那句是给人读的、会被截短、措辞还会改；判据要钉的是四个可对账的数——
           chosen 用户实际勾到的 1–10（含被忽略的 1、10）
           facs   真进约束的因数集合（2–9 那部分）
           dead   勾了但当不了因数的（1、10）——非空就必须点名，不许静默吃掉点击
           bands  每个勾选带在这一读法下的不重复道数 n 和"这一带真出得来"的因数 live
         sweep 用它断言三件事：live 覆盖 facs（勾了就必须出得了题，两层3块做全）；
         n 与产物里数到的不重复面数一致；加减法下本字段为 null（老口径逐字节不变）。 */
      facts: (() => {
        if (S.op !== 'mul') return null;
        const facs = K.mulFactorSet(S.tops);
        return {
          chosen: K.TOP_CHOICES.filter((v) => (S.tops || []).some((x) => +x === v)),
          facs, dead: K.mulDeadTops(S.tops),
          bands: K.BAND_ORDER.filter((k) => S.bands.includes(k) && K.MUL_BANDS.includes(k))
            .map((k) => ({ key: k, n: K.mulFactCount(k, facs), live: K.mulLiveFacts(k, facs) }))
        };
      })(),
      /* 工具栏的分布（用户 2026-11-17 第 4 条"各个选项要合理分布"→ 2026-11-18 第 2 条
         "选项中每个区域都有空白，空间没有合理利用"）：
         "空白"拆成三个能从真渲染盒子里读出来的数——
           rg   块内右侧剩＝块盒子右边缘 − 块内"墨"的最右（贴合内容时只剩 11px 内边距；墨怎么认见下面）
           bg   块内下方剩＝同一个块里内容最低点离块底多远
           tail 行尾剩＝这一行（换行后的一段）右边缘 − 该行最后一个内容的右边缘
         分行不看 top（.act 是 align-self:center，top 本来就比同行低一截，按 top 数行会误报），
         看 left：同一行的块必然一个比一个靠右，换行后首块又回到行首。
         sweep 的判据就钉这三个数（见 sweep.py「选项区不许留大块空白」）。*/
      barLayout: (() => {
        const tb = document.querySelector('.toolbar').getBoundingClientRect();
        const rows = [].map.call(document.querySelectorAll('.toolbar .row'), (row) => {
          const rr = row.getBoundingClientRect();
          let prev = null, line = -1, items = [];
          [].forEach.call(row.children, (n) => {
            const b = n.getBoundingClientRect();
            // 换行占位（.brk，height:0、basis:100%）不是块：量它等于给行尾判据装了个永远读 0 的假尾巴
            if (!b.height) return;
            const nl = !prev || b.left < prev.right - 1;
            if (nl) { line++; items.push({ line, kids: [] }); }
            /* 块内"墨"的最右 / 最下：只认两种盒子——
               ① 叶子（没有元素子节点：按钮、输入框、图标 span）；
               ② 自己身上就有字的（label / .hint 这种：里面套了个 checkbox，但"附答案页"几个字
                  一直写到盒子右边缘，只算那个 checkbox 就把墨的量短了，rg 会假亮）。
               为什么不能扫所有元素：容器天生会被拉成和块一样宽（.btns 是 flex 行，块宽它多宽），
               量它就等于"盒子自己减自己"＝永远只剩内边距，把 grow 摊平那种死白全放过——
               负对照 scripts/bar_negctl.py 的 grow 那一档第一次就是这么漏掉的（out/negctl_grow.html 实测）。
               0×0 的跳过（隐藏的 note、空 chips）。 */
            const hasWords = (e) => [].some.call(e.childNodes, (t) => t.nodeType === 3 && /\S/.test(t.nodeValue));
            let cr = b.left, cb = b.top;
            [].forEach.call(n.querySelectorAll('*'), (e) => {
              if (e.children.length && !hasWords(e)) return;
              const q = e.getBoundingClientRect();
              if (!q.width && !q.height) return;
              if (q.right > cr) cr = q.right;
              if (q.bottom > cb) cb = q.bottom;
            });
            items[line].kids.push({ cls: n.className, w: +b.width.toFixed(0),
              cw: +(cr - b.left).toFixed(0), rg: +(b.right - cr).toFixed(0),
              bg: +(b.bottom - cb).toFixed(0), h: +b.height.toFixed(0),
              gap: prev && !nl ? +(b.left - prev.right).toFixed(0) : null });
            if (nl) items[line].left = b.left;
            items[line].right = Math.max(items[line].right || 0, cr);
            prev = b;
          });
          return { w: +rr.width.toFixed(0), lines: items.length,
            rows: items.map((l) => ({ n: l.kids.length, kids: l.kids,
              tail: +(rr.right - l.right).toFixed(0), gaps: l.kids.map((k) => k.gap) })) };
        });
        return { h: +tb.height.toFixed(0), rows };
      })(),
      /* 示范两幅的数（只有真印在纸上的那一次才回传）：判据用它钉"错例必须真的算错"——
         用户第 5 条的原始问题就是错例被标了 ✗ 但算式全对，光看代码看不出来。 */
      demo: (S.rule !== 'off' && !miniRule()) ? demoFig() : null,
      /* 行内分布 + 空砖底色（第 1、2 条的机器钉子）与每页上限（第 3 条）*/
      spread: err ? null : rowCheck(),
      wallsCap: wallsCap(),
      u: res ? +res.u.toFixed(2) : 0,
      ansK: +ANS_K.toFixed(2), ansFit: ANS_FIT,
      selftest: stCheck,
      floor: res ? +res.floor.toFixed(2) : 0, tol: res ? +res.tol.toFixed(2) : 0,
      over: res && res.views ? +res.over.toFixed(2) : 0, overEl: OVER_EL, stuck: !!(res && res.stuck), fail: LAST_FAIL,
      air: res && res.views ? +res.air.toFixed(1) : null, airEl: res && res.views ? res.airEl : '', small: !!(res && res.small),
      views: views.map((sh) => ({
        seed: sh.seed, total: sh.total, holes: sh.holes, split: sh.splitN, join: sh.joinN,
        degraded: sh.degraded, dups: sh.dups, shrunk: sh.shrunk, dropped: sh.dropped,
        planH: sh.planH, availH: sh.availH,
        fixed: sh.fixed, auto: sh.auto, short: sh.short, wallsOver: sh.wallsOver, bandsDropped: sh.bandsDropped,
        clipped: sh.clipped, capCut: sh.capCut, autoFull: sh.autoFull, wallsCap: sh.wallsCap,
        maxVal: sh.maxVal, maxShown: sh.maxShown, bondN: sh.bondN,
        bands: sh.bands.map((b) => ({ key: b.key, L: b.L, shape: b.shape, label: b.label, cols: b.cols, rows: b.rows, per: b.per, u: b.u, h: b.h, one: b.one, start: b.start })),
        structs: sh.structs.map((st) => ({
          key: st.key, L: st.L, shape: st.shape, op: st.op, n: st.n, maxVal: st.maxVal,
          headline: st.headline, headlineCell: st.headlineCell,
          cells: st.cells.map((c) => [c.i, c.val, c.row, c.col, c.span, c.kids ? c.kids.join(',') : '']),
          hidden: [...st.hidden],
          log: st.log.map((e) => ({ cell: e.cell, dir: e.dir, from: e.from })),
          wantSplit: st.wantSplit, wantJoin: st.wantJoin, degraded: st.degraded,
          holesWanted: st.holesWanted, holesActual: st.holesActual, holesBase: st.holesBase, shrunk: st.shrunk,
        })),
      })),
    };
    const old = Q('diag'); if (old) old.remove();
    const sc = document.createElement('script');
    sc.type = 'application/json'; sc.id = 'diag';
    sc.textContent = JSON.stringify(diag);
    document.body.appendChild(sc);
    if (err) {
      Q('stat').innerHTML = '<b style="color:#b2342c">✗ ' + err + '</b>';
    } else {
      /* 撑满判据用真渲染量出来的"底部剩余"，不用模型自算的账：
         剩余超过一整行高度说明贪心没吃到东西（模型偏保守），得看见。
         撞每页 30 面上限时留白是设计本身（第 3 条要的就是"少而大"），跟固定墙数同一口径，不报。 */
      const rowH = Math.max.apply(null, views[0].bands.map((b) => b.one)) + GEO.bandGap;
      const warn = [];
      const n0 = views[0].total, h0 = views[0].holes;
      if (res.over > res.tol) warn.push(F('statOver', { o: res.over.toFixed(1) }));
      if (!(S.walls > 0) && !views[0].capCut && res.air > rowH) warn.push(F('statAir', { air: res.air.toFixed(0) }));
      if (res.small) warn.push(F('statSmall', { u: res.u.toFixed(1) }));
      warn.push.apply(warn, wallsNotes(views));
      if (stCheck && !stCheck.ok) warn.push(F('statTrust', { read: (stCheck.after - stCheck.before).toFixed(1) }));
      warn.push.apply(warn, kernelNotes(views));
      /* 状态读数按用户 2026-11-18 给的口径压成一句：砖宽 · 每页几面 · 空砖几个 · 溢出几毫米。
         以前那串（占高 / 底空 / 噪声底 / 分成合成 / 每带几行）没删掉，只是不再上屏——
         它们照旧进 diag，sweep 与 WebKit 判据读的还是 JSON，页面上留给老师的是一行能读完的话。
         多卷时每卷的题量本该一样（同一档解算），真不一样就是解算抖了，那种事必须喊出来。 */
      const diffTotals = [...new Set(views.map((sh) => sh.total))];
      if (diffTotals.length > 1) warn.push(F('statDiffTotals', { totals: diffTotals.join('/') }));
      /* 答案页自动压页（v4.0 第 1 条）：压成功了是正常状态，读数那一行带一句缩到百分之几；
         压到下限还塞不进一页、或答案砖掉到可读下限以下，才当问题喊出来——
         不许悄悄多印一张，也不许裁字，那两句都走 ansNotes（状态条与 diag.notes 同一份）。 */
      warn.push.apply(warn, ansNotes(views, res.u));
      const how = S.walls > 0 ? T('statHowFixed') : views[0].capCut ? T('statHowCap') : T('statHowAuto');
      // v4.5「B 中度」之后英文不再有 brick{s}，PL(h0) 这个参数没人接了，一并摘掉（中文本来也不用）
      Q('stat').textContent =
        F('statBase', { u: res.u.toFixed(1), n: n0, z: PL(n0), how, h: h0, o: res.over.toFixed(2) }) +
        (ANS_FIT && !ANS_FIT.floor ? F('statAnsShrink', { pct: Math.round(ANS_FIT.k * 100), from: ANS_FIT.from }) : '');
      if (warn.length) Q('stat').innerHTML += `<b style="color:#b2342c"> ⚠ ${warn.join(' · ')}</b>`;
    }
  }

  window.__wallRender = render;
  window.__wallState = S;
  /* 页里任何一处 JS 抛错都会让探针消失，无头排查时两眼一抹黑。留个兜底：把错误写进 DOM，
     探针脚本抓不到 probeout 时就能从 jserr 里看到真因。 */
  window.addEventListener('error', (e) => {
    const p = document.createElement('pre');
    p.id = 'jserr';
    p.textContent = 'JS 报错：' + e.message + ' @' + (e.filename || '') + ':' + e.lineno + ':' + e.colno;
    document.body.appendChild(p);
  });
  /* 无头量测要能一次跑到某个配置：?cfg={"bands":["b2","l3"],"ranges":["le10"],"op":"mul"} 直接灌进状态。
     只认已知键，值原样覆盖——这是给自己用的测试入口，不是给用户的输入口。 */
  function applyCfg() {
    const m = location.search.match(/[?&]cfg=([^&]+)/);
    if (!m) return;
    let c;
    try { c = JSON.parse(decodeURIComponent(m[1])); } catch (e) { return; }
    Object.keys(c).forEach((k) => { if (k in S) S[k] = c[k]; });
    if (c.layers && !c.bands) S.bands = c.layers.map((L) => (L === 2 ? 'b2' : 'l' + L));   // 旧键兜底
    syncBands(); syncRanges();
    const el = Q('seed'); if (el && c.seed) el.value = S.seed;
  }

  /* 测试入口之二：?click=chipsTops:6,8;chipsMode:le10 —— 在页面里真按一次那颗按钮，再让探针读状态。
     为什么非要有这条：?cfg= 是把值灌进 S，走的是"渲染"那半边；用户点的是 handler 那半边。
     v3.1 的"复选点了没反应"和 v3.4 顶砖按钮点不亮（dataset.v 是字符串 "6"，状态里存的是数字 6，
     includes 一比就错），灌配置都看不出来。两条路都对，才算这个按钮真的能用。 */
  function applyClicks() {
    const m = location.search.match(/[?&]click=([^&]+)/);
    if (!m) return;
    decodeURIComponent(m[1]).split(';').forEach((spec) => {
      const parts = spec.split(':');
      const box = Q(parts[0]);
      if (!box) { CLICK_MISS.push('没有这组按钮：' + parts[0]); return; }
      (parts[1] || '').split(',').filter(Boolean).forEach((v) => {
        const b = [].filter.call(box.children, (n) => n.dataset.v === v)[0];
        if (!b) { CLICK_MISS.push(spec + ' → 这组里没有值为 ' + v + ' 的按钮'); return; }
        b.click();                            // 走真实 onclick：置灰的按钮点下去必须啥也不发生
      });
    });
  }

  /* ================= 语言开关（中文 / English）=================
     规格照数格涂涂 `references/i18n.md` §3–§4：静态标签挂 data-t / data-h / data-tt / data-ph，
     `applyLang()` 一次刷完；纸面文字全在渲染函数里现拼，所以切完语言整页重画、砖宽由版面重解。
     **顺序有讲究**：`applyLang()` 必须在 `render()`（里面跑 syncBar）之前——syncBar 会把 chip 的字、
     悬停说明、状态读数按当前语言重刷一遍，反了就会出现"纸已经英文、按钮还是中文"。 */
  function setNodeText(el, s) {
    /* label 里嵌着 checkbox（`<label><input> 附答案页</label>`）：整段 innerHTML 换掉会把勾丢掉，
       所以只替换最后一个文本节点。数格涂涂同一条。
       前导空白要留着——中文那侧" 附答案页"的空格是 checkbox 和文字之间的间隔，
       抄没了就等于改了中文渲染（第一条腿"中文态与 v4.2 逐字节相同"当场会红）。 */
    const kids = el.childNodes;
    for (let i = kids.length - 1; i >= 0; i--) {
      if (kids[i].nodeType === 3 && kids[i].nodeValue.trim() !== '') {
        kids[i].nodeValue = kids[i].nodeValue.match(/^\s*/)[0] + s;   // 非全局正则，match 与 exec 返回同一个数组
        return;
      }
    }
    el.appendChild(document.createTextNode(s));
  }
  function applyLang() {
    document.documentElement.setAttribute('lang', LANG === 'en' ? 'en' : 'zh-CN');
    document.title = T('docTitle');
    [].forEach.call(document.querySelectorAll('[data-t]'), (el) => setNodeText(el, T(el.getAttribute('data-t'))));
    [].forEach.call(document.querySelectorAll('[data-h]'), (el) => { el.innerHTML = T(el.getAttribute('data-h')); });
    [].forEach.call(document.querySelectorAll('[data-tt]'), (el) => el.setAttribute('title', T(el.getAttribute('data-tt'))));
    [].forEach.call(document.querySelectorAll('[data-ph]'), (el) => el.setAttribute('placeholder', T(el.getAttribute('data-ph'))));
  }
  function switchLang(l) {
    LANG = (l === 'en') ? 'en' : 'zh';
    try { localStorage.setItem('wallfill.lang', LANG); } catch (e) { /* file:// 下可能禁写，读也一样包一层 */ }
    if (K.setKLang) K.setKLang(LANG);          // 内核那批原因句跟着走（KLANG 默认 zh，校验脚本永远看中文）
    applyLang();
    render();
  }
  /* 语言初值优先级：?lang= ＞ 这台机器上次选的（localStorage）＞ 浏览器语言。
     自己打开还是中文；文件发给别人，对方一打开就是他的语言。 */
  function langInit() {
    const u = new URLSearchParams(location.search);
    let l = u.get('lang');
    if (l !== 'en' && l !== 'zh') { try { l = localStorage.getItem('wallfill.lang'); } catch (e) { l = null; } }
    if (l !== 'en' && l !== 'zh') l = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
    LANG = l === 'en' ? 'en' : 'zh';
  }
  window.__wallLang = () => LANG;    // 探针要能读到当前语言（判据不许只长在页面上）

  document.addEventListener('DOMContentLoaded', () => {
    langInit();
    if (K.setKLang) K.setKLang(LANG);
    applyCfg();
    applyLang();
    buildBar();
    applyClicks();
    render();
    if (location.search.includes('probe=1')) probe();
  });

  /* ================= 探针：毫米只从这里出 ================= */
  function probe() {
    const out = [];
    [].forEach.call(document.querySelectorAll('.sheet'), (s) => {
      const sr = s.getBoundingClientRect();
      const cs = getComputedStyle(s);
      const padL = parseFloat(cs.paddingLeft), padT = parseFloat(cs.paddingTop);
      const ox = sr.left + padL, oy = sr.top + padT;
      const blocks = ['.hd', '.rulebar', '.wallzone', '.eqrow', '.ft']
        .map((k) => s.querySelector(k)).filter(Boolean)
        .map((n) => { const r = n.getBoundingClientRect(); return { k: n.className.split(' ')[0], top: +((r.top - oy) * MM).toFixed(1), bot: +((r.bottom - oy) * MM).toFixed(1), right: +((r.right - ox) * MM).toFixed(1) }; });
      const br = [...s.querySelectorAll('.bk')].map((n) => { const r = n.getBoundingClientRect(); return { w: +(r.width * MM).toFixed(2), h: +(r.height * MM).toFixed(2) }; });
      const widths = [...new Set(br.map((x) => x.w))];
      const heights = [...new Set(br.map((x) => x.h))];
      const wall = s.querySelector('.wallzone');
      /* "空气"＝块与块之间最大的那道缝（含最后一块到版心底边），照数格涂涂口径取 max 而非 min：
         页脚靠 margin-top:auto 贴底，它前面那道缝本来就该有，用 min 会天天误报"底部余量 0mm"。 */
      const bot = sr.bottom - parseFloat(cs.paddingBottom);   // 版心底边（border-box 减掉下内边距）
      let air = 0;
      for (let i = 1; i < blocks.length; i++) air = Math.max(air, blocks[i].top - blocks[i - 1].bot);
      if (blocks.length) air = Math.max(air, (bot - oy) * MM - blocks[blocks.length - 1].bot);
      /* 真正的"浪费"量在棋盘区里：.wallzone 是 flex:1，会把剩余高度吃掉并居中显示，
         所以块间缝看不出来——上下两道居中的空白才是。两侧相加 = 这一页没用掉的纵向空间。 */
      const bands = [].map.call(s.querySelectorAll('.wallzone > .band'), (b) => {
        const r = b.getBoundingClientRect();
        return { rows: b.querySelectorAll('.browr').length, groups: b.querySelectorAll('.group').length, top: +((r.top - oy) * MM).toFixed(1), bot: +((r.bottom - oy) * MM).toFixed(1) };
      });
      const wr = wall ? wall.getBoundingClientRect() : null;
      const wallSlack = wr && bands.length
        ? +(((bands[0].top - (wr.top - oy) * MM) + ((wr.bottom - oy) * MM) - bands[bands.length - 1].bot)).toFixed(1) : null;
      out.push({
        copy: s.dataset.copy || '', cls: s.className,
        /* 纸面文字原样抄一份出来：用户逐条给的句子（怎么玩、检查行）只能核对不许改写，
           而版面上有没有这些字，只有真渲染说了才算——node 侧看 TXT 常量是另一回事。 */
        paper: (() => {
          const tx = (sel) => { const n = s.querySelector(sel); return n ? n.textContent.replace(/\s+/g, ' ').trim() : ''; };
          const labs = [].map.call(s.querySelectorAll('.glabel'), (n) => n.textContent.replace(/\s+/g, ' ').trim());
          return { sub: tx('.hd .sub'), rule: tx('.rulebar .rseg'), democap: [].map.call(s.querySelectorAll('.dcap'), (n) => n.textContent).join('/'),
                   glabel: labs.slice(0, 3), labels: labs.length, labelDups: labs.length - new Set(labs).size,
                   meta: [].map.call(s.querySelectorAll('.meta .line'), (n) => n.textContent.trim()).join(' / '),
                   ft: tx('.ft'), baskets: s.querySelectorAll('.basket').length, eq: s.querySelectorAll('.eq').length };
        })(),
        contentW: +((sr.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) * MM).toFixed(1),
        contentH: +((sr.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)) * MM).toFixed(1),
        scrollOver: +((s.scrollHeight - s.clientHeight) * MM).toFixed(2),
        scrollOverW: +((s.scrollWidth - s.clientWidth) * MM).toFixed(2),
        inkRight: +Math.max(0, ...blocks.map((b) => b.right)).toFixed(1),
        blocks, brickWidths: widths, brickHeights: heights,
        holes: s.querySelectorAll('.bk.hv').length, filled: s.querySelectorAll('.bk.a').length,
        groups: s.querySelectorAll('.group').length, baskets: s.querySelectorAll('.basket').length,
        eqrows: s.querySelectorAll('.eqrow').length,
        bandRows: bands.map((b) => b.rows), wallSlack,
        wallzoneBottom: wall ? +((wall.getBoundingClientRect().bottom - oy) * MM).toFixed(1) : null, air,
        /* 校准用：布局模型里的 label/砖高/推导行高是不是真数，量一次就知道。
           模型高估 → 版面底下空一大截；低估 → 溢出。两边都见过，所以留着。 */
        calib: (() => {
          const hm = (sel) => { const n = s.querySelector(sel); return n ? +(n.getBoundingClientRect().height * MM).toFixed(2) : null; };
          const one = s.querySelector('.group');
          return {
            hd: hm('.hd'), rulebar: hm('.rulebar'), wallzone: hm('.wallzone'), ft: hm('.ft'),
            group: one ? +(one.getBoundingClientRect().height * MM).toFixed(2) : null,
            layers: one ? one.querySelectorAll('.brow').length : 0,
            glabel: hm('.glabel'), wall: hm('.wall'), eqrow: hm('.eqrow'),
          };
        })(),
      });
    });
    /* 漏答案自检（只看渲染出来的学生页，不看内核字段）：卷头"砖上的数最大 N"取的是全体
       最大值还是看得见值？两层3块只勾"合"时挖的就是顶砖，取全体就是把答案印在卷头上。
       v3 取消了集章表，所以那条"不许印得数"的检查也一并退出；学生页连推导算式都不该出现。*/
    const leak = [];
    [].forEach.call(document.querySelectorAll('.sheet:not(.anssheet)'), (s) => {
      if (s.querySelector('.eqrow')) leak.push('学生页出现推导算式行');
      const sub = s.querySelector('.hd .sub');
      if (sub) {
        const m = sub.textContent.match(/最大\s*([0-9]+)/);
        const vis = [].map.call(s.querySelectorAll('.bk'), (n) => parseInt(n.textContent, 10)).filter((x) => x > 0);
        if (m && vis.length && +m[1] > Math.max.apply(null, vis)) leak.push('卷头最大值 ' + m[1] + ' 大于看得见的最大砖 ' + Math.max.apply(null, vis));
      }
    });
    /* 裁开线的账（用户 2026-11-18 挑的 C1）：屏幕态能读的都是"结构对不对"——
       线在不在、是不是虚线、文案有没有被改写、有没有老老实实夹在"上半页＋下半页"中间、
       上下各让开多少。缝宽 10mm、线心落点这些打印态几何不在屏幕态算（`.sheet.two` 屏幕 141mm、
       打印 127mm，两个数不是一回事），由 scripts/cutline_check.py 拿真打印样式另量一份。
       这里读的是每根线自己：判据在 sweep.py「裁开线」那节。 */
    const cut = [];
    [].forEach.call(document.querySelectorAll('.cutline'), (n) => {
      const r = n.getBoundingClientRect();
      const segs = [].map.call(n.querySelectorAll('i'), (i) => {
        const q = i.getBoundingClientRect(), c = getComputedStyle(i);
        return { top: q.top, left: q.left, right: q.right, w: q.width,
                 style: c.borderTopStyle, color: c.borderTopColor, px: parseFloat(c.borderTopWidth) };
      });
      const prev = n.previousElementSibling, next = n.nextElementSibling;
      const lineY = segs.length ? segs.reduce((a, s) => a + s.top, 0) / segs.length : r.top;
      const pr = prev ? prev.getBoundingClientRect() : null, nr = next ? next.getBoundingClientRect() : null;
      const ink = (s) => { if (!s) return null;
        const k = ['.ft', '.rulebar', '.wallzone', '.hd'].map((x) => s.querySelector(x)).filter(Boolean);
        return k.length ? Math.max.apply(null, k.map((x) => x.getBoundingClientRect().bottom)) : null; };
      const inkTop = (s) => { if (!s) return null;
        const k = ['.hd', '.rulebar', '.wallzone'].map((x) => s.querySelector(x)).filter(Boolean);
        return k.length ? Math.min.apply(null, k.map((x) => x.getBoundingClientRect().top)) : null; };
      cut.push({
        after: prev ? prev.className.replace(/^sheet\s*/, '') : '（前面没东西）',
        before: next ? next.className.replace(/^sheet\s*/, '') : '（后面没东西）',
        text: (n.querySelector('span') || {}).textContent || '',
        segs: segs.length,
        dashed: segs.length === 2 && segs.every((s) => s.style === 'dashed'),
        lineWidth: +Math.max.apply(null, segs.map((s) => s.w || 0)).toFixed(2),
        boxH: +(r.height * MM).toFixed(2),
        // 线→上卷盒子底 / 线→下卷盒子顶，以及到两侧"墨"的距离（屏幕态，只判有没有压着字）
        toUp: pr ? +((lineY - pr.bottom) * MM).toFixed(2) : null,
        toDn: nr ? +((nr.top - lineY) * MM).toFixed(2) : null,
        inkUp: pr ? +((lineY - (ink(prev) || pr.bottom)) * MM).toFixed(2) : null,
        inkDn: nr ? +(((inkTop(next) || nr.top) - lineY) * MM).toFixed(2) : null,
        // 横向：线的两端该和上半页的版心两边对齐（屏幕态卷宽 210＋左右各 13mm 内边距）
        xL: pr ? +((Math.min.apply(null, segs.map((s) => s.left)) - pr.left) * MM).toFixed(2) : null,
        xR: pr ? +((pr.right - Math.max.apply(null, segs.map((s) => s.right))) * MM).toFixed(2) : null,
        xSpan: pr ? +((Math.max.apply(null, segs.map((s) => s.right)) -
          Math.min.apply(null, segs.map((s) => s.left))) * MM).toFixed(2) : null,
        // 缝的居中偏差：线心离"上下两卷盒子之间那道缝"的中点差多少（结构上必须几乎为 0）
        midOff: pr && nr ? +((lineY - (pr.bottom + nr.top) / 2) * MM).toFixed(2) : null,
      });
    });
    const d = Q('diag');
    const box = document.createElement('pre');
    box.id = 'probeout';
    box.textContent = JSON.stringify({ probe: true, tries: window.__tries || null, leak, cut,
      pdfName: window.__pdfName ? window.__pdfName() : null,
      diag: d ? JSON.parse(d.textContent) : null, sheets: out }, null, 1);
    document.body.appendChild(box);
  }
})();
</script>
</body>
</html>
